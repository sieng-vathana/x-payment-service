server:
  port: ${PAYMENT_SERVICE_PORT:8084}

spring:
  banner:
    location: classpath:banner.txt
    mode: console
  application:
    name: x-payment-service
  profiles:
    default: local
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      properties:
        # Realtime events are best effort; never wait long for a missing broker.
        max.block.ms: 2000

x:
  http:
    logging:
      enabled: true
      server: x-payment-service
      hop: "x-api-gateway → x-bff → x-payment-service"
      hops:
        /api/v1/payments: "x-api-gateway → x-bff → x-payment-service"
