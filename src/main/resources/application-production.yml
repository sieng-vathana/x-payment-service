spring:
  config:
    activate:
      on-profile: production
    import: optional:file:../config/secrets.yml
  datasource:
    url: jdbc:mysql://${db.host}:${db.port}/${db.prod.name}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${db.prod.username}
    password: ${db.prod.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false

services:
  store:
    base-url: ${STORE_SERVICE_URL:http://x-store-service:8080}
  user:
    base-url: ${USER_SERVICE_URL:http://x-user-service:8080}
  business:
    base-url: ${BUSINESS_SERVICE_URL:http://x-business-service:8080}
  order:
    base-url: ${ORDER_SERVICE_URL:http://x-order-service:8080}
  customer:
    base-url: ${CUSTOMER_SERVICE_URL:http://x-customer-service:8080}
